[package]
name = "cuescord-update"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Transactional per-user Windows application updater for Cuescord"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
