[package]
name = "cuescord-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows native voice process for Cuescord Desktop"

[dependencies]
libloading = "=0.8.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
panic = "abort"
strip = true
lto = "thin"
