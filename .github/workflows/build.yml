name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            arch: x64
            command: desktop:build:win
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
            command: desktop:build:linux
          - platform: macos
            runner: macos-15
            arch: arm64
            command: desktop:build:mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate preload and check JavaScript syntax
        run: pnpm desktop:check
      - name: Check source formatting and unit tests
        run: |
          pnpm format:check
          pnpm test
      - name: Verify macOS screen picker authorization in Electron
        if: matrix.platform == 'macos'
        run: pnpm exec playwright test tests/capture-native.spec.ts --workers=1
      - name: Check release version and runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node scripts/ci-version.mjs
      - name: Select the pinned Rust toolchain for native voice
        if: matrix.platform == 'windows'
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup override set 1.94.0
      - name: Build installer
        run: pnpm ${{ matrix.command }}
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'windows' && secrets.WIN_CSC_LINK || matrix.platform == 'macos' && secrets.MAC_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'windows' && secrets.WIN_CSC_KEY_PASSWORD || matrix.platform == 'macos' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify signed macOS microphone and camera permissions
        if: matrix.platform == 'macos'
        run: node scripts/check-mac-media.mjs
      - name: Package installer ZIP, legacy installer and provenance
        run: node scripts/artifacts.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - name: Sign update manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/sign-update.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Instaladores gerados pelo GitHub Actions a partir desta tag pública.

          - Windows x64: ZIP contendo o instalador .exe
          - Debian/Ubuntu amd64: ZIP contendo o pacote .deb
          - macOS Apple Silicon arm64: ZIP contendo o .dmg; sem versão Intel

          Para instalar manualmente, extraia o ZIP e abra o instalador pelo sistema.
          Instaladores diretos também são publicados para compatibilidade com clientes antigos.

          update-manifest.json autentica os ZIPs e os instaladores com a chave pública embutida no cliente.
          Consulte os arquivos build-info e sha256sums para identificar commit, runtime e hashes.
          Assinatura de publicador/notarização dependem dos certificados configurados pelo mantenedor.
          Sem certificados, Windows não tem assinatura de publicador e macOS usa assinatura ad-hoc.
          macOS 13+ permite áudio do aplicativo escolhido ou do sistema, com seleção explícita e permissão de gravação de tela/áudio.
          Windows x64 inclui voz nativa experimental, desabilitada por padrão e habilitável nas configurações de voz fora da chamada.
          A opção exige interface web e servidor de voz compatíveis; servidores anteriores continuam usando a voz padrão.
          A captura e reprodução de voz nativa usam WebRTC em um processo separado. Câmera e compartilhamento continuam no caminho atual.
          A interface é carregada do serviço remoto; este repositório contém o cliente desktop.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to replace signed assets. Publish a new version."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Cuescord Desktop $RELEASE_TAG" --notes-file notes.md
          gh release upload "$RELEASE_TAG" artifacts/*
          gh release edit "$RELEASE_TAG" --draft=false --latest
